name: Deploy demo to GitHub Pages

# Builds a STATIC EXPORT of the site with mock fixture data and publishes it to
# the `gh-pages` branch. Deploying via a plain git push (not the Pages deploy
# API) avoids the "Resource not accessible by integration" permission error.
#
# After the first run, set repo Settings → Pages → Source: "Deploy from a
# branch" → Branch: gh-pages / (root). (Pages on a PRIVATE repo needs a paid
# plan — make the repo public to use it for free.)
#
# Server-only features are intentionally absent in this static demo:
#   - /go click tracking, /img Drive proxy, /api/revalidate webhook (removed)
#   - "Mua ngay" links go straight to the affiliate URL (NEXT_PUBLIC_STATIC_EXPORT)
# The full-featured version runs on a server (e.g. Vercel) with live Google data.

on:
  push:
    branches:
      - claude/decor-affiliate-platform-vn-6a6l5m
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export
        run: |
          # Route handlers can't be statically exported — remove them for the demo.
          rm -rf "src/app/api" "src/app/go" "src/app/img"
          # dynamicParams must be a literal false under output: export.
          find src/app -name 'page.tsx' -exec \
            sed -i 's/export const dynamicParams = true;/export const dynamicParams = false;/' {} +

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          USE_MOCK_DATA: "true"
          PAGES_BASE_PATH: "/affiliate-decor"
          NEXT_PUBLIC_SITE_URL: "https://hsonvu1912.github.io/affiliate-decor"
        run: npx next build

      - name: Publish to gh-pages branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy static demo (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
